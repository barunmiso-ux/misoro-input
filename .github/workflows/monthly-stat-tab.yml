name: create-monthly-stat-tab

# 매월 1일, 지점 통계 '월간탭(YY-MM월)'을 전 지점 시트에 자동 생성 + 집계.
# 주간 자동화(weekly-tab.yml)의 월간판. 주간탭은 자동인데 월간만 수동이라 구멍(안산 26-06/07)이 났었음.
#  ① 지난달 마감: 완료된 달을 --refresh 로 재집계(그 달 주간탭 최종본으로 확정).
#  ② 이번달 개설: 새 달 월간탭을 미리 만들어(현재까지 주간 집계) 지점이 바로 볼 수 있게.
# 집계는 clear-then-write라 재실행해도 중복 없음. 매출·총내원(157행↓)은 OKTAS 월말결산 몫(안 건드림).
# 필요: 리포 Secret 'GCP_SA_KEY' (서비스계정 JSON 내용).

on:
  schedule:
    - cron: "0 6 1 * *"       # 매월 1일 06:00 UTC (= 15:00 KST)
  workflow_dispatch:           # 수동 실행

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install --quiet google-auth google-api-python-client
      - name: 지난달 마감 + 이번달 개설
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          PREV=$(date -u -d '1 month ago' +%y-%m)
          CUR=$(date -u +%y-%m)
          echo "== 지난달 마감 (재집계 $PREV) =="
          python create_month_tabs.py --month "$PREV" --commit --refresh
          echo "== 이번달 개설 (생성 $CUR) =="
          python create_month_tabs.py --month "$CUR" --commit
